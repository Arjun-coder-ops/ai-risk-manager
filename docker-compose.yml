services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_risk}
      POSTGRES_USER: ${POSTGRES_USER:-ai_risk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-risk-network

  ai-risk-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-risk-manager
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_APP=backend.app
      - FLASK_ENV=production
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-ai_risk}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_risk}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - ALLOW_BOOTSTRAP_REGISTRATION=${ALLOW_BOOTSTRAP_REGISTRATION:-false}
      - MAX_CSV_INGESTION_ROWS=${MAX_CSV_INGESTION_ROWS:-1000}
      - MAX_TRANSACTION_INGESTION_ROWS=${MAX_TRANSACTION_INGESTION_ROWS:-1000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ai-risk-network
    healthcheck:
      # The runtime image intentionally does not ship curl. Use the Python
      # standard library, which is guaranteed to be present in this image.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    # Restart policy for production
    restart: unless-stopped
    # Resource limits (adjust as needed)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 2G
    #     reservations:
    #       cpus: '1'
    #       memory: 1G

  ingestion-worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-ai_risk}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_risk}
    depends_on:
      postgres:
        condition: service_healthy
      ai-risk-manager:
        condition: service_healthy
    command: ["python", "-m", "backend.ingestion_worker", "--poll-seconds", "5"]
    healthcheck:
      # This process has no HTTP listener.  Verify the dependency it needs to
      # claim and complete jobs instead of inheriting the web API healthcheck.
      test: ["CMD", "python", "-c", "from backend.database import get_engine; from sqlalchemy import text; connection=get_engine().connect(); connection.execute(text('SELECT 1')); connection.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - ai-risk-network
    restart: unless-stopped

networks:
  ai-risk-network:
    driver: bridge

# Optional: Add a volume for persistent storage
volumes:
  postgres_data:
