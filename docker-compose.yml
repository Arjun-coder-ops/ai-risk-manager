services:
  ai-risk-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-risk-manager
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_APP=backend.app
      - FLASK_ENV=production
    networks:
      - ai-risk-network
    healthcheck:
      # The runtime image intentionally does not ship curl. Use the Python
      # standard library, which is guaranteed to be present in this image.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    # Restart policy for production
    restart: unless-stopped
    # Resource limits (adjust as needed)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 2G
    #     reservations:
    #       cpus: '1'
    #       memory: 1G

networks:
  ai-risk-network:
    driver: bridge

# Optional: Add a volume for persistent storage
# volumes:
#   ai_risk_data:
#     driver: local
